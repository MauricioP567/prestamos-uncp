<header class="sticky top-0 z-30 border-b border-slate-200 bg-white/80 backdrop-blur-md">
  <div class="flex h-16 items-center justify-between px-6">
    <div class="flex items-center gap-3">
      <button class="lg:hidden rounded-lg p-2 hover:bg-slate-100">
        <i data-lucide="menu" class="h-5 w-5"></i>
      </button>
      <h1 class="font-display text-lg font-semibold text-ink-800">{% block page_title %}Panel{% endblock %}</h1>
    </div>
    <div class="flex items-center gap-3">
      {% if nav_vencidos %}
        <div class="hidden sm:flex items-center gap-2 rounded-full bg-rose-50 px-3 py-1.5 text-xs font-semibold text-rose-700 border border-rose-200">
          <i data-lucide="alert-triangle" class="h-3.5 w-3.5"></i>
          {{ nav_vencidos }} vencido(s)
        </div>
      {% endif %}
      <div class="flex h-9 w-9 items-center justify-center rounded-full bg-gradient-to-br from-brand-500 to-sky-500 text-sm font-semibold text-white">
        {{ user.iniciales }}
      </div>
    </div>
  </div>
</header>
